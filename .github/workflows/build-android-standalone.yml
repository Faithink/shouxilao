name: build-android-standalone
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare sources and assets
        run: bash android-standalone/scripts/prepare.sh
      - name: Build arm64 APK (for phones)
        working-directory: android-standalone
        run: gradle assembleDebug --no-daemon --stacktrace -Pabis=arm64-v8a
      - name: Stash arm64 APK
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          mkdir -p dist
          cp android-standalone/app/build/outputs/apk/debug/app-debug.apk "dist/shouxi-standalone-$VER-arm64.apk"
      - name: Build x86_64 APK (for the emulator test)
        working-directory: android-standalone
        run: gradle assembleDebug --no-daemon --stacktrace -Pabis=x86_64
      - name: Stash x86_64 APK
        run: cp android-standalone/app/build/outputs/apk/debug/app-debug.apk dist/test-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-apks
          path: dist/*.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disable-animations: true
          script: bash android-standalone/scripts/emutest.sh dist/test-x86_64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-shots
          path: out/
