name: build-windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./packaging/build_win.ps1
      - name: Smoke test (first-run flow + full refresh)
        shell: pwsh
        timeout-minutes: 20
        run: ./packaging/win_smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 收息佬-win
          path: packaging/build/收息佬-win-*.zip
