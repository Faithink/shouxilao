name: build-windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./packaging/build_win.ps1
      - name: Smoke test (first-run flow + full refresh)
        shell: pwsh
        timeout-minutes: 25
        run: ./packaging/win_smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: 收息佬-win
          path: packaging/build/收息佬-win-*.zip
      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          cp packaging/build/收息佬-win-*.zip "Shouxi-win-$VER.zip"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "收息佬 $VER" --notes "构建产物(私有仓库,发布前由 tools/publish_release.py 取用)" || true
          gh release upload "$TAG" "Shouxi-win-$VER.zip" --clobber
