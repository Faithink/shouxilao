name: pages
# 网页版(shouxilao.app,托管在 EdgeOne,读 pwa-dist 分支);GitHub Pages 只放一个跳转页。网页版的数据每个工作日收盘后自动刷新一次,打包成静态快照发布。
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * 1-5"      # 北京时间 17:30,A 股、港股都已收盘
  workflow_dispatch:
permissions:
  contents: write      # 要把网页版静态文件推到 pwa-dist 分支
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypinyin
      - name: Restore slow-data cache (dividends / financials)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: shouxi-cache-${{ github.run_id }}
          restore-keys: shouxi-cache-
      - name: Refresh data (quick (price-only) on pushes and weekdays; full refresh on Fridays and manual runs)
        continue-on-error: true      # 数据源临时失败时,退回仓库里已有的快照,不让发布失败
        run: |
          python - <<'PY'
          import datetime, os
          import fetch_data
          ev = os.environ.get("GITHUB_EVENT_NAME")
          mode = "full" if (ev == "workflow_dispatch" or (ev == "schedule" and datetime.date.today().weekday() == 4)) else "quick"
          print("mode", mode)
          errs = fetch_data.run(log=lambda s: None, mode=mode)
          print("errors:", len(errs or {}))
          PY
      - run: python tools/build_pwa.py site-app
      - name: GitHub Pages only redirects to the web app (shouxilao.app)
        run: |
          mkdir -p site
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://shouxilao.app/"><link rel="canonical" href="https://shouxilao.app/"><title>收息佬</title><p>网页版已迁移到 <a href="https://shouxilao.app/">shouxilao.app</a></p>' > site/index.html
          touch site/.nojekyll
      - name: Publish the web app to the pwa-dist branch (for other static hosts)
        run: |
          cd site-app
          git init -q -b pwa-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "web app build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pwa-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
