plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def appVersion = file('../../VERSION').text.trim()
def vparts = appVersion.split('\\.')
def appVersionCode = vparts[0].toInteger() * 10000 + vparts[1].toInteger() * 100 + vparts[2].toInteger()

android {
    namespace 'com.shouxi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.shouxi.app"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion

        ndk {
            // 真机用 arm64;云端模拟器测试用 -Pabis=x86_64
            abiFilters.addAll(((project.findProperty('abis') ?: 'arm64-v8a') as String).split(','))
        }
        python {
            version "3.12"
            buildPython "python3"
            pip {
                install "certifi"
                install "pypinyin"
                install "segno"
            }
        }
    }

    // 固定签名:云端构建从 GitHub 加密变量里读密钥(环境变量 SHOUXI_KEYSTORE 等);没有这些变量(比如别人自己构建)就用临时的调试签名
    signingConfigs {
        shouxi {
            if (System.getenv("SHOUXI_KEYSTORE")) {
                storeFile file(System.getenv("SHOUXI_KEYSTORE"))
                storeType "pkcs12"
                storePassword System.getenv("SHOUXI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SHOUXI_KEY_ALIAS")
                keyPassword System.getenv("SHOUXI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv("SHOUXI_KEYSTORE")) signingConfig signingConfigs.shouxi
        }
        release {
            minifyEnabled false
            signingConfig System.getenv("SHOUXI_KEYSTORE") ? signingConfigs.shouxi : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
