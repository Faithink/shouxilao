<style>
:root{
  color-scheme:light;--tl-g:#22c55e;--tl-y:#fbbf24;--tl-r:#ef4444;
  --bg:#f9f8f4;--card:#ffffff;--ink:#1f2430;--mute:#7e8493;--line:#ebe8e1;--accent:#9a7229;--accent-ink:#fff;--seg:#ebe8df;--bad:#cf5a4f;--serif:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,serif;
  --heavy:#0b6b4f;--heavy-bg:#d7f3e7;--buy:#168a3c;--buy-bg:#e1f5e7;--hold:#8a6a00;--hold-bg:#fbf0cc;
  --high:#b25000;--high-bg:#fde5cd;--profit:#b42318;--profit-bg:#fde0dc;--none-bg:#f4f2ec;
  --c1:#cfae6f;--c2:#6f8fc4;--c3:#8b7fb8;--zb0:#17c28a;--zb1:#6fd46b;--zb2:#f7cf45;--zb3:#fb923c;--zb4:#f0524f;--st-def:#4f86e3;--st-fin:#9a80e6;--st-gro:#3fae80;--st-cyc:#f08c4a;--shadow:0 1px 2px rgba(31,36,48,.05),0 2px 8px rgba(31,36,48,.04);--shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --hdr:rgba(249,248,244,.88);
}
:root[data-theme="dark"]{
  --bg:#0c1018;--card:#131a24;--ink:#e3e8f2;--mute:#8a94a8;--line:#242c3b;--accent:#c9a96e;--accent-ink:#1b1405;--seg:#1a2233;--serif:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,serif;
  --heavy:#56d4a8;--heavy-bg:#12382d;--buy:#5fd07a;--buy-bg:#16341f;--hold:#e3c354;--hold-bg:#392f0f;
  --high:#f0a35e;--high-bg:#3d2610;--profit:#ff8a80;--profit-bg:#40201d;--none-bg:#1a2233;
  --c1:#c9a96e;--c2:#7f9fd6;--c3:#a89cd6;--bad:#ef7f76;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --hdr:rgba(19,26,36,.85);
color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1018;--card:#131a24;--ink:#e3e8f2;--mute:#8a94a8;--line:#242c3b;--accent:#c9a96e;--accent-ink:#1b1405;--seg:#1a2233;--serif:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,serif;
  --heavy:#56d4a8;--heavy-bg:#12382d;--buy:#5fd07a;--buy-bg:#16341f;--hold:#e3c354;--hold-bg:#392f0f;
  --high:#f0a35e;--high-bg:#3d2610;--profit:#ff8a80;--profit-bg:#40201d;--none-bg:#1a2233;
  --c1:#c9a96e;--c2:#7f9fd6;--c3:#a89cd6;--bad:#ef7f76;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --hdr:rgba(19,26,36,.85);
color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
td,.kpi .v,.big,.vt,.node b,.lt{font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

/* ---- 页头 ---- */
header{display:flex;align-items:center;gap:18px;padding:10px 28px;background:var(--hdr);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none!important;margin-right:6px}
.brand img{width:40px;height:40px;border-radius:11px;object-fit:cover;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .2s}
.brand:hover img{transform:rotate(-6deg) scale(1.06)}
.brand b{display:block;font-family:var(--serif);color:var(--accent);font-size:21px;letter-spacing:2px;line-height:1.1;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--mute);letter-spacing:.5px}
header nav{display:flex;gap:4px;background:none;padding:0}
header nav button{border:0;background:none;padding:7px 18px;border-radius:99px;font-size:13.5px;font-weight:500;color:var(--mute);cursor:pointer;transition:all .15s}
header nav button:hover{color:var(--ink)}
header nav button.on{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);box-shadow:none;font-weight:600}
.spacer{flex:1}
.mute{color:var(--mute)}
main{max-width:1280px;margin:0 auto;padding:22px 28px 40px}
.foot{max-width:1280px;margin:0 auto;padding:6px 28px 36px;font-size:12px;color:var(--mute);text-align:center}

/* ---- 卡片、按钮、表单 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px;letter-spacing:.2px}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--mute);font-weight:600}
button.btn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;box-shadow:var(--shadow)}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn:disabled{opacity:.55;cursor:default}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
button.btn.sm{padding:2px 9px;font-size:12px}
input,select{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px;border-radius:9px;font-size:13px;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=number]{width:110px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin:0 0 14px}
.crumb a{color:var(--mute);font-weight:500}.crumb a:hover{color:var(--accent);text-decoration:none}.crumb b{color:var(--ink)}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.ph h2{margin:0;font-size:22px;letter-spacing:.3px}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,.l{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;letter-spacing:.3px;transition:color .15s}
th:hover{color:var(--ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer;transition:background .12s}
tbody tr.row:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
tbody tr.row td:first-child b{font-size:14.5px}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.s-重仓区{background:var(--heavy-bg);color:var(--heavy)}
.s-买入区{background:var(--buy-bg);color:var(--buy)}
.s-持有区{background:var(--hold-bg);color:var(--hold)}
.s-偏高{background:var(--high-bg);color:var(--high)}
.s-止盈区{background:var(--profit-bg);color:var(--profit)}
.badge.s-重仓区{background:var(--zb0);color:#04382a}.badge.s-买入区{background:var(--zb1);color:#173d0d}.badge.s-持有区{background:var(--zb2);color:#4a3800}.badge.s-偏高{background:var(--zb3);color:#4a2200}.badge.s-止盈区{background:var(--zb4);color:#fff}
.badge.held{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.s-无足够数据{background:var(--none-bg);color:var(--mute)}

/* ---- 布局 ---- */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 15px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;box-shadow:var(--shadow)}
.chip:hover{transform:translateY(-1px)}
.chip.on{box-shadow:0 0 0 2px var(--accent)}
.toprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.toprow #fq{flex:1;min-width:180px;max-width:360px}
.seg .mkn{margin-left:5px;font-size:11.5px;opacity:.55;font-weight:400}
.indstrip{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin:-4px 0 14px;padding:2px 28px 6px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.indstrip::-webkit-scrollbar{display:none}.indstrip .chip{flex:none;padding:3px 12px;font-size:12px;color:var(--mute);box-shadow:none}.indstrip .chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
@media(max-width:620px){.toprow{gap:8px}.toprow #fq{max-width:none;min-width:0;width:100%;flex:1 1 100%}.indstrip .chip{padding:6px 13px;font-size:13px}}.chips.sm{margin-top:-4px}.chips.sm .chip{padding:3px 12px;font-size:12px;color:var(--mute);box-shadow:none}.chips.sm .chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);box-shadow:none}
.panel{position:fixed;top:60px;right:20px;z-index:30;width:min(600px,calc(100vw - 32px));max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-lg)}
.panel[hidden]{display:none}

/* ---- 体检 ---- */
.lights{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.lt{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--card)}
.lt b{font-weight:700}.lt span{color:var(--mute);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;vertical-align:middle}
.dot.g{background:var(--tl-g);box-shadow:0 0 0 2px color-mix(in srgb,var(--tl-g) 28%,transparent)}.dot.y{background:var(--tl-y);box-shadow:0 0 0 2px color-mix(in srgb,var(--tl-y) 32%,transparent)}.dot.r{background:var(--tl-r);box-shadow:0 0 0 2px color-mix(in srgb,var(--tl-r) 28%,transparent)}.dot.na{background:transparent;border:1.5px solid var(--mute)}
.dots .dot{width:13px;height:13px}
.dots{display:flex;gap:4px;justify-content:center}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.hc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--c,var(--line));background:var(--card)}
.hc.g{--c:var(--tl-g)}.hc.y{--c:var(--tl-y)}.hc.r{--c:var(--tl-r)}.hc.na{--c:var(--mute)}
.hc h4{margin:0;font-size:13px;display:flex;align-items:center;gap:6px}
.hc h4 em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute);font-weight:400}
.hc .big{font-size:22px;font-weight:800;margin:2px 0 4px}
.hc .why{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.5}
.sqs{display:flex;gap:3px;margin-top:4px;align-items:center;font-size:11px;color:var(--mute);white-space:nowrap}.sqs span{margin-left:4px}
.sq{width:16px;height:10px;border-radius:2px;background:var(--none-bg)}.sq.g{background:var(--c1)}.sq.r{background:var(--bad)}
.gauge{margin:8px 0 2px}.gauge .gl{font-size:12px;margin-bottom:6px}
.gbar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--zb0) 0 40%,var(--zb2) 40% 75%,var(--zb4) 75% 100%)}
.gbar i{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 1.5px var(--card)}
.gs{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:2px}

/* ---- 结论横幅、价格位置 ---- */
.verdict{display:flex;gap:18px;align-items:center;padding:14px 20px;border-radius:12px;margin:12px 0;flex-wrap:wrap}
.verdict .vt{font-size:25px;font-weight:800;white-space:nowrap;letter-spacing:.3px}
.verdict .vd{font-size:13px;flex:1;min-width:220px;color:var(--ink);line-height:1.65}
.pbar{position:relative;height:10px;width:150px;border-radius:5px;margin:6px 0 2px;background:linear-gradient(90deg,var(--zb0) 0 20%,var(--zb1) 20% 40%,var(--zb2) 40% 60%,var(--zb3) 60% 80%,var(--zb4) 80% 100%)}
.pbar i{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 1.5px var(--card)}
.pend{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);width:150px}
.warn{color:var(--high);font-size:12px}
details.card>summary,details>summary{cursor:pointer;font-weight:600;font-size:14px}
@media(max-width:900px){.g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}main{padding:16px 14px 30px}header{padding:10px 14px;gap:10px}.foot{padding:6px 14px 28px}.nodes{grid-template-columns:1fr 1fr!important}}
@media(max-width:560px){.brand small,#updated{display:none}.brand b{font-size:15px}header .btn{padding:5px 9px;font-size:12px}.ph h2{font-size:19px}.verdict .vt{font-size:21px}.hc[style*="span 2"]{grid-column:auto!important}}

<main id="main"><div class="card empty" style="text-align:center;color:var(--mute)">正在加载…</div></main>
<footer class="foot">收息佬 <span id="ver"></span> · 数据来源：东方财富、新浪财经 · 价格可能晚一个交易日 · 仅供研究，不构成投资建议 · <a href="#/">回到首页</a></footer>
<div class="tip" id="tip"></div>

<script>
const $ = (s, el=document) => el.querySelector(s);
const state = { tab:"pool", pool:null, holdings:{settings:{capital:0,maxPct:15},lots:[]}, detail:null,
  sort:{key:"verdict",dir:1}, f:{q:"",ind:"",st:"focus",minY:0}, cache:{} };

const pct = (x,d=2)=> x==null?"–":(x*100).toFixed(d)+"%";
const px = x=> x==null?"–":(Math.abs(x)<3&&x!==0?num(x,3):num(x,2));
const num = (x,d=2)=> x==null?"–":Number(x).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
const cny = x => x==null?"–":(Math.abs(x)>=1e4? num(x/1e4,2)+"万" : num(x,0));
const sgn = x => x>0?"up":x<0?"dn":"";
const today = () => new Date().toISOString().slice(0,10);
const dayDiff = (a,b)=> Math.round((new Date(b)-new Date(a))/864e5);

async function api(path, opt){ const r = await fetch(path,opt); if(r.status===401){ location.href="/login"; throw new Error("login"); } if(!r.ok) throw new Error(path); return r.json(); }
/* 买入要求 = 国债收益率 + 行业风险溢价（个股可单独覆盖）；买入价 = 取「自身历史分位价」与「要求股息率价」中更严格者 */
const RF_DEF=1.65; // 10年期国债收益率参考值（2026-10中旬约1.64%~1.66%），可在设置里改
const DEF_PREM={"煤炭":4.5,"油气":4.0,"航运":5.0,"建材":4.0,"电力":2.3,"公用事业":2.5,"消费":2.0,"交通":2.8,"通信":3.0,"银行":3.3,"保险":3.0,"券商":3.5,"汽车":3.5,"医药":2.5,"ETF":2.5,"有色金属":4.5,"建筑":3.0,"制造":3.0,"传媒":3.0};
const INDS_ALL=()=>Object.keys(DEF_PREM);
const CYCLICAL=new Set(["煤炭","油气","航运","建材","有色金属","建筑"]); // 分红随景气波动，用近3年平均分红
const cfg=()=>{const S=state.holdings.settings; return {rf:S.rf??RF_DEF, prem:S.premiums||{}, ov:S.overrides||{}}};
// 一级大类(列表筛选、设置分组用);二级行业仍是 stocks.csv 里的 industry,买入价溢价按二级行业设
const IND_GROUPS=[["金融",["银行","券商","保险"]],["能源资源",["煤炭","油气","有色金属"]],["公用事业",["电力","公用事业","通信"]],["交通运输",["交通","航运"]],["消费医药",["消费","医药","传媒"]],["制造建筑",["汽车","制造","建筑","建材"]],["ETF",["ETF"]]];
const grpOf=ind=>(IND_GROUPS.find(([,l])=>l.includes(ind))||["其他"])[0];
const premOf=(ind,c=cfg())=>c.prem[ind]??DEF_PREM[ind]??3.0;
const floorOf=s=>{const c=cfg(); return (c.ov[s.code]??(c.rf+premOf(s.industry,c)))/100};
function applyZones(s){
  if(s._d0===undefined){s._d0=s.ttm_dps; s._z0=s.zones&&s.zones.y; s._y0=s.yield}
  let D=s._d0, y=s._z0; s.normalized=false;
  if(CYCLICAL.has(s.industry)&&s.avg3_dps>0&&s.zones_avg_y){D=s.avg3_dps; y=s.zones_avg_y; s.normalized=true}
  const z=s.zones; if(!z||!y||!(D>0)) return s;
  const f=floorOf(s); s.floor=f; s.ttm_dps=D; s.yield=D/s.price; z.y=y;
  z.heavy=D/(f+0.01); z.buy=D/f; s.rich=s.price>D/y["50"]; s.histMedY=y["50"]; s.histBuyPx=D/y["70"];
  z.hold=Math.max(D/y["30"],z.buy*1.1); z.profit=Math.max(D/y["15"],z.hold*1.1);
  const p=s.price; s.status=p<=z.heavy?"重仓区":p<=z.buy?"买入区":p<=z.hold?"持有区":p<z.profit?"偏高":"止盈区";
  return s;
}
async function getStock(code){ let d=state.cache[code]; if(!d){ d=await api("/api/stock/"+code); state.cache[code]=d } return applyZones(d); }
/* 移出股票池:服务端拒绝时(持仓里还有记录)直接提示;成功后清理关注、单独设定,并记入「已移出」方便恢复 */
async function removeStock(s){
  let r,j; try{ r=await fetch("/api/stocks/"+s.code,{method:"DELETE"}); j=await r.json() }catch(e){ notice("移出失败，请稍后再试"); return false }
  if(!r.ok){ notice(j.error||"移出失败"); return false }
  const S=state.holdings.settings;
  S.favorites=(S.favorites||[]).filter(c=>c!==s.code);
  if(S.overrides) delete S.overrides[s.code];
  S.removed=[...(S.removed||[]).filter(x=>x.code!==s.code),{code:s.code,name:s.name,industry:s.industry}];
  await saveHoldings(); delete state.cache[s.code]; await load(); return true;
}
const saveHoldings = () => api("/api/holdings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(state.holdings)});

/* ---------- 结论 ---------- */
const ORDER={"重仓区":0,"买入区":1,"持有区":2,"偏高":3,"止盈区":4,"无足够数据":5};
const SN={"重仓区":"低位","买入区":"偏低","持有区":"适中","偏高":"偏高","止盈区":"高位","无足够数据":"数据不足"}; // 内部状态键 → 显示名（只表达价格位置，不含仓位或操作含义）
const LABEL=SN;
const GROUPS={s0:{label:"低位",sts:["重仓区"],cls:"s-重仓区"},s1:{label:"偏低",sts:["买入区"],cls:"s-买入区"},s2:{label:"适中",sts:["持有区"],cls:"s-持有区"},
  s3:{label:"偏高",sts:["偏高"],cls:"s-偏高"},s4:{label:"高位",sts:["止盈区"],cls:"s-止盈区"}};
// 把价格映射到 5 等分的"便宜→贵"条上，位置 0~1
function posFrac(price,z){
  const pts=[0,z.heavy,z.buy,z.hold,z.profit,z.profit*1.3]; let i=0;
  while(i<4&&price>pts[i+1]) i++;
  const f=(price-pts[i])/((pts[i+1]-pts[i])||1);
  return Math.max(0,Math.min(1,(i+Math.max(0,Math.min(1,f)))/5));
}
const priceBar=(s,labels)=>s.zones?`<div class="pbar"><i style="left:${(posFrac(s.price,s.zones)*100).toFixed(1)}%"></i></div>${labels?'<div class="pend"><span>便宜</span><span>贵</span></div>':""}`:"–";
const LVT={g:"良好",y:"留意",r:"警惕",na:"不适用"};
const dotsOf=s=>{const l=lightsOf(s); return l?`<div class="dots">${Object.keys(HN).map(k=>`<i class="dot ${l[k]}" title="${HN[k]}:${LVT[l[k]]}"></i>`).join("")}</div>`:"–"};
// 重点关注：价格偏低或低位 + 体检无质量红灯 + 区间可信（股价未大跌）
const isFocus=s=>!!s.zones&&ORDER[s.status]<=1&&!qRed(s).length&&!distrust(s);
const distrust=s=>s.zones&&s.zones.buy>s.price*1.5;
const isRich=s=>!!s.rich&&s.zones&&ORDER[s.status]<=1; // 满足你的要求，但股息率低于它自己近5年的中位水平
const qRed=s=>redNames(s).filter(n=>n!=="估值"); // 质量类红灯（不含估值）
const lab=s=>LABEL[s.status]; // 标签只写价格位置；体检红灯、股价大跌用单独的 ⚠ 提醒行
const HN={div:"分红能力",earn:"盈利质量",stab:"分红稳定",safe:"财务安全",val:"估值"};
const lightsOf=s=>s.lights||(s.health?Object.fromEntries(Object.entries(s.health.lights).map(([k,v])=>[k,v.lv])):null);
const redNames=s=>{const l=lightsOf(s); return l?Object.keys(HN).filter(k=>l[k]==="r").map(k=>HN[k]):[]};
function reason(d){
  const z=d.zones; if(!z) return "历史数据不足，无法给出区间。";
  const gap=(d.price/z.buy-1)*100, req=d.ttm_dps/z.buy;
  let t;
  if(d.status==="重仓区") t=`价格处于低位：现价 ${px(d.price)} 低于买入价 ${px(z.buy)}，当前股息率 ${pct(d.yield)}，比你的要求（${pct(req,1)}）还高出 1 个点以上。`;
  else if(d.status==="买入区") t=`价格偏低：现价 ${px(d.price)} 不高于买入价 ${px(z.buy)}，当前股息率 ${pct(d.yield)}，达到了你的要求（${pct(req,1)}）。`;
  else if(d.status==="持有区") t=`价格适中：现价比买入价 ${px(z.buy)} 高 ${gap.toFixed(0)}%，当前股息率 ${pct(d.yield)}，还没达到你的要求（${pct(req,1)}）。回落到 ${px(z.buy)} 以下才算达标。`;
  else if(d.status==="偏高") t=`价格偏高：当前股息率 ${pct(d.yield)} 已低于它自己多数时候的水平。`;
  else t=`价格处于高位：当前股息率 ${pct(d.yield)}，处在它自己近 5 年最低的一档（价格 ≥ ${px(z.profit)}）。`;
  if(isRich(d)) t+=` 注意：当前股息率 ${pct(d.yield)} 低于它自己近5年的中位水平（${pct(d.histMedY,1)}），按自身历史并不算低。`;
  if(ORDER[d.status]<=1&&redNames(d).length) t+=` ⚠ 公司体检有红灯：${redNames(d).join("、")}（见下方体检卡），只看价格不够，先看这些再决定。`;
  if(distrust(d)) t+=" ⚠ 该股股价较历史大幅下跌，区间偏宽，先看盈利是否恶化。";
  return t;
}

// 个人所得税差别化： ≤1个月 20%; 1个月~1年 10%; >1年 免税 （按持股期限，卖出时补扣）
const taxRate = days => days<=31?0.2 : days<=365?0.1 : 0;
const taxLabel = r => r===0.2?"20%":r===0.1?"10%":"免税";
/* 港股:持仓页单独成一块,全程用港元计,不算红利税。B 股:价格和分红用美元/港元,持仓页折合人民币,红利税按 10% 估算 */
const CU={CNY:"元",HKD:"港元",USD:"美元"}, CS={CNY:"",HKD:"HK$",USD:"US$"};
const cu=d=>CU[d.ccy||"CNY"], mkt=d=>d.market==="hk"?"港股":d.market==="b"?"B 股":"";
const taxOf=(d,days)=>d.industry==="ETF"?0:d.market==="hk"?0:d.market==="b"?0.1:taxRate(days);
const fxOf=d=>(d&&d.fx)||1;
function cnyView(d){const f=fxOf(d); if(f===1||!d) return d;
  const o={...d,fx_orig:d,price:d.price*f,ttm_dps:d.ttm_dps*f,avg3_dps:(d.avg3_dps||0)*f,histBuyPx:d.histBuyPx==null?d.histBuyPx:d.histBuyPx*f};
  if(d.zones){o.zones={...d.zones}; ["heavy","buy","hold","profit"].forEach(k=>o.zones[k]*=f)}
  o.forward=(d.forward||[]).map(x=>({...x,cash:x.cash*f})); o.records=(d.records||[]).map(r=>({...r,cash10:r.cash10*f})); return o}

/* ---------- 图表 ---------- */
const tip = $("#tip");
function lineChart(series, labels, o={}){
  const W=820,H=o.h||240,L=46,R=12,T=10,B=24, n=labels.length;
  let all=series.flatMap(s=>s.data.filter(v=>v!=null)); let lo=Math.min(...all), hi=Math.max(...all);
  if(o.zero) lo=Math.min(lo,0); const pad=(hi-lo)*.06||1; lo-=o.zero?0:pad; hi+=pad;
  const x=i=>L+(W-L-R)*i/(n-1), y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const fmt=o.fmt||(v=>num(v,0));
  let g="";
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(v)}</text>`}
  let last="";labels.forEach((lb,i)=>{const yr=lb.slice(0,4); if(yr!==last && lb.slice(5)<="03" ){last=yr;g+=`<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="middle">${yr}</text>`}});
  const paths=series.map(s=>{let d="";s.data.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="5 4"':''}/>`}).join("");
  const id="c"+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const svg=document.getElementById(id); if(!svg)return;
    svg.addEventListener("mousemove",e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;
      const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));
      tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";
      tip.textContent=labels[i]+"\n"+series.map(s=>s.name+": "+(s.data[i]==null?"–":(o.tipfmt||fmt)(s.data[i]))).join("\n")});
    svg.addEventListener("mouseleave",()=>tip.style.display="none")});
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>
  <svg id="${id}" class="chart" viewBox="0 0 ${W} ${H}">${g}${paths}</svg>`;
}
function barChart(items, o={}){ // items [{label,v,sub}]
  const W=820,H=o.h||200,L=46,R=8,T=14,B=26,n=items.length, mx=Math.max(...items.map(i=>i.v),0.0001)*1.1;
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-v/mx);
  let g="";for(let k=0;k<=3;k++){const v=mx*k/3;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${(o.fmt||(v=>num(v,1)))(v)}</text>`}
  items.forEach((it,i)=>{const x=L+bw*i+bw*.18,w=bw*.64;
    g+=`<rect x="${x}" y="${y(it.v)}" width="${w}" height="${H-B-y(it.v)}" rx="3" fill="${it.color||"var(--accent)"}" opacity="${it.partial?.5:1}"><title>${it.label}: ${(o.fmt||(v=>num(v,2)))(it.v)}${it.sub?" · "+it.sub:""}</title></rect>
    <text x="${x+w/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mute)">${it.label}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------- 公司体检卡 ---------- */
function miniBars(items,o={}){
  const W=260,H=o.h||96,T=14,B=16,L=4,R=4,n=items.length; if(!n) return '<div class="sub">数据不足</div>';
  const vals=items.map(i=>i.v).concat((o.refs||[]).map(r=>r.v)), mx=Math.max(...vals,0)*1.12||1, mn=Math.min(0,...vals)*1.12;
  const bw=(W-L-R)/n, y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn)), fmt=o.fmt||(v=>num(v,1));
  let g=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  (o.refs||[]).forEach(r=>g+=`<line x1="${L}" x2="${W-R}" y1="${y(r.v)}" y2="${y(r.v)}" stroke="${r.c}" stroke-dasharray="4 3" stroke-width="1.2"/><text x="${W-R}" y="${y(r.v)-2}" text-anchor="end" font-size="9" fill="${r.c}">${r.t||""}</text>`);
  items.forEach((it,i)=>{const x=L+bw*i+bw*.16,w=bw*.68,y0=y(0),y1=y(it.v);
    g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${it.c}"><title>${it.l}: ${fmt(it.v)}</title></rect>
    <text x="${x+w/2}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--mute)">${it.l}</text>
    <text x="${x+w/2}" y="${Math.min(y0,y1)-3}" font-size="9" text-anchor="middle" fill="var(--ink)">${fmt(it.v)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>`;
}
function miniLine(ser,med,color){
  if(!ser||ser.length<3) return "";
  const W=260,H=70,T=6,B=6,vs=ser.map(s=>s[1]), lo=Math.min(...vs,med||1e9),hi=Math.max(...vs,med||0), x=i=>4+(W-8)*i/(ser.length-1), y=v=>T+(H-T-B)*(1-(v-lo)/((hi-lo)||1));
  const d=ser.map((s,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(s[1]).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/>${med?`<line x1="4" x2="${W-4}" y1="${y(med)}" y2="${y(med)}" stroke="var(--mute)" stroke-dasharray="4 3"/>`:""}</svg><div class="sub" style="font-size:11px">近5年走势 · 虚线 = 自身中位数 ${num(med,1)}</div>`;
}
const gauge=(label,pc)=>pc==null?`<div class="gauge"><div class="gl">${label}：历史分位不可用</div></div>`:`<div class="gauge"><div class="gl">${label} · 高于自身近5年 <b>${Math.round(pc*100)}%</b> 的时间</div><div class="gbar"><i style="left:${Math.max(1,Math.min(99,pc*100))}%"></i></div><div class="gs"><span>便宜</span><span>贵</span></div></div>`;

function healthCard(d){
  const h=d.health; if(!h) return "";
  const L=h.lights, G="var(--c1)",Y="var(--c1)",R="var(--bad)",A="var(--c1)";
  const fin=h.fin.slice(-8), yy=r=>String(r.year).slice(2);
  const infra=["电力","交通","公用事业"].includes(d.industry), gy=infra?[60,75]:[50,70], roeG=h.is_fin?9:10;
  const pos=(v,g,yv)=>v<=g?G:v<=yv?Y:R;

/* ---------- 卖出:按先买先卖冲减批次 ---------- */
// lots 是买入批次(原样保存),sells 是卖出记录。按卖出日期顺序,每笔卖出先冲减最早的、买入日不晚于卖出日的批次(和红利税"先进先出"一致)。
function applySells(H){
  const lots=H.lots.map(l=>({...l,orig:l.shares})), real=[];
  [...(H.sells||[])].sort((a,b)=>a.date.localeCompare(b.date)).forEach(sl=>{
    let need=sl.shares; const portions=[];
    lots.filter(l=>l.code===sl.code&&l.date<=sl.date&&l.shares>0).sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      if(need<=0) return; const q=Math.min(l.shares,need); l.shares-=q; need-=q; portions.push({date:l.date,price:l.price,shares:q})});
    real.push({...sl,portions,short:need});
  });
  return {active:lots.filter(l=>l.shares>0),real};
}

const EYE_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

function maskName(n){return n[0]+"***"}
function applyPrivacy(root,names,inds){
  const nameRx=names.slice().sort((a,b)=>b.length-a.length).filter(Boolean).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const rxNames=nameRx.length?new RegExp(nameRx.join("|"),"g"):null;
  const indRx=(inds||[]).slice().sort((a,b)=>b.length-a.length).filter(Boolean).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const rxInds=indRx.length?new RegExp(indRx.join("|"),"g"):null;
  const rxNum=/\d+\/\d+|\d{4}-\d{2}-\d{2}|\d{1,2}-\d{2}|[-+−]?\d[\d,]*(?:\.\d+)?(?:\s?[%％万亿元股份次只笔])?/g;
  const skip="#entry,.pub,input,textarea,script,style,.dlg";
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[];
  while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t=>{
    if(t.parentElement&&t.parentElement.closest(skip)) return;
    let v=t.nodeValue; if(!/[\d\u4e00-\u9fa5A-Za-z]/.test(v)) return;
    if(rxNames) v=v.replace(rxNames,m=>maskName(m));
    if(rxInds) v=v.replace(rxInds,"**");
    v=v.replace(rxNum,(m,off,str)=>{ if(/^\d+\/\d+$/.test(m)) return m; const nx=str[off+m.length]; if(nx&&"月年天档".includes(nx)) return m; return "**" });
    if(v!==t.nodeValue) t.nodeValue=v;
  });
  root.classList.add("priv-on");
  root.querySelectorAll(".hbody .verdict,.hbody .nodes").forEach(e=>e.remove());   // 价格位置结论、加仓止盈节点:直接移除,不只是隐藏
  root.querySelectorAll(".badge").forEach(b=>{if(/\bs-/.test(b.className)||b.classList.contains("held")){b.className="badge pbadge"; b.textContent="***"}});
  root.querySelectorAll("[title]").forEach(e=>{if(!e.closest("#entry")&&e.id!=="privbtn") e.removeAttribute("title")});
}

async function renderHold(){

  H.sells=H.sells||[];

  const det={}; await Promise.all(codes.map(async c=>det[c]=await getStock(c).catch(()=>null)));
  const isHK=c=>/^\d{5}$/.test(c);
  const fxs={}; codes.forEach(c=>{const d=det[c]; fxs[c]=isHK(c)?1:fxOf(d); if(d&&!isHK(c)) det[c]=cnyView(d)});
  eff.active.forEach(l=>{l.price*=fxs[l.code]||1});
  eff.real.forEach(r=>{const f=fxs[r.code]||1; r.price*=f; r.portions.forEach(p=>{p.price*=f})});

/* ---------- 含息总收益 ---------- */
// 买入日之后、登记日之前已持有的除息分红（估算）；税按"今天卖出"的持股期限补缴（一年以内卖出补税，超过一年免税）
function recvDiv(d,lots,t0){
  let gross=0,tax=0,n=0;
  (d.records||[]).forEach(r=>{
    if(!r.ex||r.ex>t0||!(r.cash10>0)) return;
    let hit=false;
    lots.forEach(l=>{const ok=r.reg?(l.date<=r.reg):(l.date<r.ex); if(!ok) return; hit=true;
      const g=l.shares*r.cash10/10; gross+=g; tax+=g*taxOf(d,Math.max(0,dayDiff(l.date,t0)))});
    if(hit) n++;
  });
  return {gross,tax,n};
}
function totalCard(groups,T){
  const tot=T.gain+T.recv-T.rtax, rows=[...groups].sort((a,b)=>b.total/b.cost-a.total/a.cost);
  const mx=Math.max(...rows.map(g=>Math.abs(g.gain/g.cost)+Math.max(0,(g.rc.gross-g.rc.tax)/g.cost)),0.01);
  const bars=rows.map(g=>{const p=g.gain/g.cost, dv=(g.rc.gross-g.rc.tax)/g.cost, t=g.total/g.cost;
    return `<div class="trow"><div class="tn"><b>${g.d.name}</b></div>
      <div class="tbar"><i class="${p>=0?"tp":"tpn"}" style="width:${(Math.abs(p)/mx*100).toFixed(1)}%" title="价差 ${pct(p,1)}"></i><i class="td" style="width:${(Math.max(0,dv)/mx*100).toFixed(1)}%" title="已收分红（税后估算） ${pct(dv,1)}"></i></div>
      <div class="tv"><b class="${sgn(t)}">${pct(t,1)}</b><span class="sub">价差 ${pct(p,1)} · 分红 ${pct(dv,1)}</span></div></div>`}).join("");
  return `<div class="card"><h2>含息总收益 <span class="sub" style="font-weight:400">· 税后总回报 = 价差 + 已收分红 − 税（别只看浮盈）</span></h2>
    <div class="grid g4" style="margin:6px 0 12px">
      <div class="kpi"><div class="k">含息总收益</div><div class="v ${sgn(tot)}">${cny(tot)}</div><div class="sub">占成本 <b class="${sgn(tot)}">${pct(T.cost?tot/T.cost:0,1)}</b></div></div>
      <div class="kpi"><div class="k">价差（浮盈）</div><div class="v ${sgn(T.gain)}">${cny(T.gain)}</div><div class="sub">${pct(T.cost?T.gain/T.cost:0,1)}</div></div>
      <div class="kpi"><div class="k">已收分红（税前）</div><div class="v">${cny(T.recv)}</div><div class="sub">${pct(T.cost?T.recv/T.cost:0,1)} · 买入后已除息的</div></div>
      <div class="kpi"><div class="k">若今天卖出需补税</div><div class="v">${cny(T.rtax)}</div><div class="sub">持股满一年的分红免税</div></div>
    </div>
    <div class="legend"><span><i style="background:var(--c1)"></i>价差</span><span><i style="background:var(--c2)"></i>已收分红（税后估算）</span><span><i style="background:var(--tl-r)"></i>价差为负</span></div>
    <div class="tlist">${bars}</div>
    <p class="note pub">已收分红按每个批次买入日之后、股权登记日之前已持有的除息记录估算；税按「今天卖出」的持股期限计（一年以内卖出，分红要按持股期限补税）。不含手续费，送转股没有调整。含息总收益才是你真正赚到的，价差只是其中一部分。</p></div>`;
}

/* ---------- 配置分析（持仓页） ---------- */
function allocCard(groups,T){
  const S=state.holdings.settings, tg=S.targets||{}, c=cfg(), keys=["def","fin","gro","cyc","oth"].filter(k=>k!=="oth"||groups.some(g=>styleKey(g.d.industry)==="oth"));
  const by={}; keys.forEach(k=>by[k]={mv:0,div:0,prem:0,names:[]}); const byI={};
  groups.forEach(g=>{const k=styleKey(g.d.industry), b=by[k]; b.mv+=g.mv; b.div+=g.gross; b.prem+=g.mv*premOf(g.d.industry); b.names.push(g.d.name); byI[g.d.industry]=(byI[g.d.industry]||0)+g.mv});
  const tot=T.mv||1, share=k=>by[k].mv/tot;
  const avgPrem=keys.reduce((a,k)=>a+by[k].prem,0)/tot, reqY=(c.rf+avgPrem)/100, actY=T.gross/tot;

  const rows=keys.map(k=>{const b=by[k], s=STYLES[k], cur=share(k)*100, t=+tg[k]||0, diff=cur-t;
    return `<div class="arow"><div class="an"><i class="sdot" style="background:${s.c}"></i><b>${s.name}</b><span class="sub">${b.names.length?b.names.join("、"):"—"}</span></div>
      <div class="ab"><div class="atrack"><i style="width:${Math.min(100,cur)}%;background:${s.c}"></i>${hasT?`<u style="left:${Math.min(100,t)}%" title="目标 ${t}%"></u>`:""}</div></div>
      <div class="av"><b>${cur.toFixed(0)}%</b><span class="sub">${b.mv?`股息率 ${pct(b.div/b.mv,1)} · 溢价 ${(b.prem/b.mv).toFixed(1)}`:"—"}</span>${hasT&&t?`<span class="sub ${(Math.abs(diff)>=5||Math.abs(diff)/t>=0.25)?"warn":""}">目标 ${t}% · ${diff>0?"高":"低"} ${Math.abs(diff).toFixed(0)}</span>`:""}</div></div>`}).join("");
  const ind=Object.entries(byI).sort((a,b)=>b[1]-a[1]);
  const hints=[]; const top=ind[0];
  if(top&&top[1]/tot>0.4&&ind.length>1) hints.push(`「${top[0]}」占 ${Math.round(top[1]/tot*100)}%，行业集中度偏高：同一行业的股票常常一起涨跌，分红也容易一起受影响。`);
  else if(ind.length===1&&groups.length>1) hints.push(`目前只持有「${top[0]}」一个行业，所有持仓面对同一类风险。`);
  if(share("cyc")>0.4) hints.push(`周期型占 ${Math.round(share("cyc")*100)}%：这类股票景气差时分红会明显减少，收入的稳定性要留意。`);
  if(groups.length&&groups.length<5) hints.push(`目前持有 ${groups.length} 只，个股的偶发事件（分红被砍、业绩暴雷）对整体影响较大。`);
  if(keys.filter(k=>by[k].mv>0).length===1&&groups.length>1) hints.push(`只持有「${STYLES[keys.find(k=>by[k].mv>0)].name}」一类风险属性。`);
  const devs=keys.filter(k=>{const t=+tg[k]||0, d=Math.abs(share(k)*100-t); return t>0&&(d>=5||d/t>=0.25)});
  if(devs.length) hints.push(`「${devs.map(k=>STYLES[k].name).join("、")}」偏离目标已超过阈值（偏离 ≥5 个百分点，或相对目标 ≥25%）。调整的顺序：先用新增资金和收到的分红补足低配的类别，不要急着卖出高配的；A 股持股一年以内卖出，分红要补税，别为了调仓打断持股期限。`);
  return `<div class="card"><h2>配置分析 <span class="sub" style="font-weight:400">· 按风险属性看你的钱分在哪（溢价来自风险，不是股息越高越好）</span></h2>

    <div class="tablewrap"><table><thead><tr><th>卖出日</th><th>股票</th><th>卖出价</th><th>数量</th><th>成本均价</th><th>价差</th><th>持有期分红</th><th>含息合计</th><th></th></tr></thead><tbody>
    ${rr.map(r=>`<tr><td class="l">${r.date}</td><td class="l">${r.name}</td><td>${px(r.price)}</td><td>${r.q}</td><td>${r.q?num(r.cost/r.q):"–"}</td><td class="${sgn(r.gain)}">${hkd(r.gain)}</td><td>${hkd(r.div)}</td><td class="${sgn(r.total)}"><b>${hkd(r.total)}</b></td><td><button class="btn sm" data-delsell="${r.id}">删</button></td></tr>`).join("")}</tbody></table></div></div>`,`<b class="${sgn(R.total)}">${hkd(R.total)}</b>`):"";

function posCard(g,cap,maxPct){
  const {d,lots,sh,cost,mv,avg}=g, z=d.zones, pnl=mv-cost;
  const yoc = d.ttm_dps/avg;
  const posPct = cap? mv/cap*100 : null;
  const room = cap? Math.max(0,cap*maxPct/100-mv):null;
  const addQty = room!=null? Math.floor(room/d.price/100)*100 : null;
  // 四个节点按价格从低到高排列:加仓二档 < 加仓一档 < 止盈一档 < 止盈二档（股价下跌时先触发一档，再触发二档）
  const nodes = z? [
    ["加仓二档",Math.min(z.heavy,avg*0.9),"低位线 / 成本价 -10% 取低，可再加 1/3",d.price<=Math.min(z.heavy,avg*0.9)],
    ["加仓一档",z.buy,"买入价（偏低区上沿），可先加 1/3 仓",d.price<=z.buy],
    ["止盈一档",z.profit,"进入高位，可减 1/3",d.price>=z.profit],
    ["止盈二档",z.profit*1.15,"高于高位线 15%，可再减 1/3",d.price>=z.profit*1.15]] : [];
  let advice="数据不足";
  if(z){
    if(d.price>=z.profit) advice=`价格处于高位（股息率 ${pct(d.yield)}，近5年最低的一档）：可考虑按节点分批减仓/止盈，或持有至满1年享免税再减。`;
    else if(d.price>=z.hold) advice="价格偏高：可暂停加仓，继续持有收息。";
    else if(d.price>z.buy) advice="价格适中：以持有为主，等回到买入价以下再考虑加仓。";
    else if(room!=null && room<d.price*100) advice=`价格${d.price<=z.heavy?"处于低位":"偏低"}，但这只股票的仓位已达你设的上限，不再加仓。`;
    else advice=`价格${d.price<=z.heavy?"处于低位":"偏低"}：可考虑加仓${addQty?`（在你设的仓位上限内，最多再买约 ${addQty} 股）`:""}。`;
  }
  return `<div class="card">
    <div class="pos-head"><h3>${d.name}</h3><span class="mute">${d.code}</span> ${stagHtml(d.industry)}<div class="spacer"></div><button class="btn sm" data-sell="${d.code}">卖出</button> <button class="btn sm" data-open="${d.code}">查看详情</button></div>
    <div class="grid g4">
      <div class="kpi"><div class="k">持仓 / 均价</div><div class="v">${sh} 股</div><div class="sub">均价 ${num(avg,3)} · 现价 ${px(d.price)}</div></div>
      <div class="kpi"><div class="k">市值 / 浮盈</div><div class="v">${cny(mv)}</div><div class="sub"><span class="${sgn(pnl)}">${cny(pnl)} (${pct(pnl/cost,1)})</span></div></div>
      <div class="kpi"><div class="k">成本股息率 / 现价股息率</div><div class="v">${pct(yoc)}</div><div class="sub">现价股息率 ${pct(d.yield)}</div></div>
      <div class="kpi"><div class="k">未来12月分红 税前 → 税后</div><div class="v">${cny(g.gross)} → ${cny(g.gross-g.tax)}</div><div class="sub">预计红利税 ${cny(g.tax)}</div></div>

// 页内对话框:不用浏览器自带的 confirm/prompt/alert(内置浏览器和部分手机浏览器会直接忽略它们)
function dlg({title,msg="",fields=[],ok="确定",cancel="取消"}){
  return new Promise(res=>{
    const w=document.createElement("div"); w.className="mask";
    w.innerHTML=`<div class="dlg" role="dialog"><h3>${title}</h3>${msg?`<p>${msg}</p>`:""}${fields.map(f=>`<label>${f.label}<input name="${f.k}" type="${f.type||"number"}" step="${f.step||"any"}" value="${f.v??""}"></label>`).join("")}<div class="acts">${cancel?`<button class="btn" data-x="0">${cancel}</button>`:""}<button class="btn primary" data-x="1">${ok}</button></div></div>`;
    const val=()=>Object.fromEntries([...w.querySelectorAll("input")].map(i=>[i.name,i.value]));
    const done=v=>{w.remove(); document.removeEventListener("keydown",kd); res(v)};
    const kd=e=>{if(e.key==="Escape")done(null); else if(e.key==="Enter"&&e.target.tagName!=="BUTTON")done(val())};
    w.onclick=e=>{const x=e.target.dataset.x; if(x==="1")done(val()); else if(x==="0"||e.target===w)done(null)};
    document.addEventListener("keydown",kd); document.body.appendChild(w);
    const f=w.querySelector("input"); if(f){f.focus(); f.select()} else w.querySelector("[data-x='1']").focus();
  });
}

function simSvg(a1,a2,target,hit){

  a1.forEach((v,i)=>{const x=L+bw*i+bw*.15, w=bw*.7, on=hit&&i+1===hit; g+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(1,H-B-y(v))}" rx="2" fill="${on?"var(--ink)":"var(--c1)"}" opacity="${hit&&i+1>=hit?1:.55}"><title>第${i+1}年 年股息 ${v.toFixed(2)} 万</title></rect>`; if((i+1)%5===0||i===0) g+=`<text x="${x+w/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mute)">${i+1}</text>`});
  g+=`<path d="${a2.map((v,i)=>(i?"L":"M")+(L+bw*i+bw/2).toFixed(1)+","+y(v).toFixed(1)).join("")}" fill="none" stroke="var(--c2)" stroke-width="2.2"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--tl-r)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${W-R}" y="${y(target)-5}" text-anchor="end" font-size="11" fill="var(--tl-r)">目标 ${target} 万/年</text>`;

  <div class="card" id="sec-faq"><h2>常见疑问与误区</h2>
    <details><summary>分红和利息一样吗？</summary><p class="note">不一样。利息通常由合同约定，分红取决于公司当年的经营和分配决定，可能增加、减少，也可能暂停。另外股价会涨跌，总回报要把分红和价差一起看（见「③ 股息率不等于收益率」）。</p></details>
    <details><summary>红利 ETF 和自己选股有什么区别？</summary><p class="note">ETF 是按指数规则打包的一篮子股票，能分散单只公司的风险；但不同红利指数的筛选规则、行业分布和费用都不同。买之前可以先看指数规则、主要持仓和费率，详见「⑥ 红利 ETF」。</p></details>
    <details><summary>登记日前买入才能领分红吗？</summary><p class="note">一般来说，股权登记日收盘时持有股票，才有资格领取这次分红；除息日起股价会按分红额调整。是否值得买，仍然要看公司和价格位置，不必只为赶分红而买（见「⑩ 登记日 · 除息日」）。</p></details>
    <details><summary>股息率越高越好？</summary><p class="note">不一定。股息率 = 分红 ÷ 股价，股价暴跌会把它推高。要看分红是不是真能持续：公司有没有赚到钱、分红率是否超过 100%。这正是「公司体检」要回答的。</p></details>
    <details><summary>只看股息率，不看公司？</summary><p class="note">高股息的公司里有一部分是"股息陷阱":盈利在恶化，分红随后被砍。先看体检的五个灯，再看价格。</p></details>
    <details><summary>全仓同一个行业？</summary><p class="note">同一行业的股票常一起涨跌，分红也一起受影响。按防御、金融、成长、周期分散，不同风险互相抵消。</p></details>
    <details><summary>涨了很多再买，股息率就低了？</summary><p class="note">对。买入价越高，同样的分红对应的股息率越低。所以设「买入要求」，只在价格偏低（达到要求）时分批买。</p></details>
    <details><summary>分红领完就赚了？</summary><p class="note">除息日股价会按分红额下调。收息的回报要看长期：分红的累计、股价的填权，以及再投资的复利。</p></details>

  const calcE=()=>{[e1,e2,e3].forEach(paintR); const a=+e1.value, f=+e2.value, o=+e3.value, net=a-f-o;

    $("#er").textContent=net.toFixed(2)+"%"; $("#es").textContent=`指数 ${a.toFixed(1)}% − 费用 ${f.toFixed(2)}% − 其他拖累 ${o.toFixed(2)}% = ${net.toFixed(2)}%`;
    const tot=Math.max(Math.abs(a),0.5);
    $("#ebar").innerHTML=`<div class="trow"><div class="tn"><b>指数回报</b></div><div class="tbar"><i class="tp" style="width:${Math.max(0,a)/tot*100}%"></i></div><div class="tv"><b>${a.toFixed(2)}%</b></div></div>

  [e1,e2,e3].forEach(e=>e.oninput=calcE); calcE();
  // ⑧ 再投 vs 花掉
  let rtax=0; const rr=["r1","r2","r3","r4"].map(i=>$("#"+i));

    let g=""; for(let k=0;k<=4;k++){const v=mx*k/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v.toFixed(1)}</text>`}
    a.forEach((_,i)=>{if((i+1)%5===0||i===0) g+=`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--mute)">${i+1}</text>`});
    const path=(s,c)=>`<path d="${s.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("")}" fill="none" stroke="${c}" stroke-width="2.6"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${path(b,"var(--c2)")}${path(a,"var(--c1)")}<text x="${W-R}" y="${y(a[n-1])-6}" text-anchor="end" font-size="12" fill="var(--c1)">${a[n-1].toFixed(1)} 万</text><text x="${W-R}" y="${y(b[n-1])-6}" text-anchor="end" font-size="12" fill="var(--c2)">${b[n-1].toFixed(1)} 万</text></svg>`};
  const calcR=()=>{const V0=+rr[0].value, y=+rr[1].value/100, g=+rr[2].value/100, n=+rr[3].value;
    rr.forEach(e=>{paintR(e); $("#"+e.id+"-v").textContent=e.value});
    let sA=1,cash=0,A=[],B=[];
    for(let t=1;t<=n;t++){const dps=y*Math.pow(1+g,t-1), Pt=Math.pow(1+g,t), incA=sA*dps, incB=dps;
      A.push(incA*V0); B.push(incB*V0); sA+=incA*(1-rtax)/Pt; cash+=incB*(1-rtax)}
    const Pn=Math.pow(1+g,n), assetA=sA*Pn*V0, assetB=Pn*V0, cashB=cash*V0, totB=assetB+cashB;
    document.querySelectorAll(".rny").forEach(e=>e.textContent=n);
    $("#ra1").textContent=assetA.toFixed(0)+" 万"; $("#ra2").textContent=A[n-1].toFixed(1)+" 万";
    $("#rb1").textContent=assetB.toFixed(0)+" 万 + "+cashB.toFixed(0)+" 万"; $("#rb2").textContent=B[n-1].toFixed(1)+" 万";
    $("#rmsg").innerHTML=`<b>再投资的年股息是花掉的 ${(A[n-1]/B[n-1]).toFixed(1)} 倍</b>:A 的持股从 1 份滚到了 ${sA.toFixed(2)} 份，B 一直是 1 份。${assetA>totB?`最后 A 的总资产 ${assetA.toFixed(0)} 万，超过 B 的资产加所有已领分红（${totB.toFixed(0)} 万）。`:`这个年限下，B 的资产加已领分红（${totB.toFixed(0)} 万）还没被 A（${assetA.toFixed(0)} 万）超过，再投资的优势要靠更长的时间才显现。`}`;
    const mxv=Math.max(assetA,totB,1);
    $("#rbars").innerHTML=`<div class="navrow"><span style="width:auto">A 再投</span><div class="navbar" style="height:32px"><i style="width:${assetA/mxv*100}%">资产 ${assetA.toFixed(0)} 万</i></div></div>
      <div class="navrow"><span style="width:auto">B 花掉</span><div class="navbar" style="height:32px"><i style="width:${assetB/mxv*100}%">资产 ${assetB.toFixed(0)} 万</i><u style="width:${cashB/mxv*100}%">已花掉 ${cashB.toFixed(0)} 万</u></div></div>`;
    $("#rchart").innerHTML=lines2(A,B)};
  rr.forEach(e=>e.oninput=calcR);
  document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{rtax=+b.dataset.rt/100; document.querySelectorAll("[data-rt]").forEach(x=>x.classList.toggle("on",x===b)); calcR()});
  calcR();
}

      close(); if(l.trim()) html+=`<p>${inl(l)}</p>`});
    close(); return html};
  const cl=$("#chlog"); if(cl) cl.addEventListener("toggle",async()=>{if(!cl.open||cl.dataset.done) return; try{const r=await fetch("/changelog.md"); if(!r.ok) throw 0; $("#chlogbody").innerHTML=mdLite(await r.text()); cl.dataset.done="1"}catch(e){$("#chlogbody").innerHTML='<div class="sub">更新说明加载失败</div>'}});
  // 外观
  document.querySelectorAll("#themeseg button").forEach(b=>b.onclick=()=>{setTheme(b.dataset.th); document.querySelectorAll("#themeseg button").forEach(x=>x.classList.toggle("on",x===b))});
  // 刷新
  $("#refresh").onclick=startRefresh; paintRefresh();
  let found=null; const asMsg=(t,bad)=>{const m=$("#as-msg"); m.textContent=t; m.style.color=bad?"var(--bad)":""};
  const look=async()=>{ const code=$("#as-code").value.trim(); found=null; $("#as-res").hidden=true;
    if(!/^\d{5,6}$/.test(code)) return asMsg("代码格式不对：A 股、B 股、ETF 填 6 位，港股填 5 位",1);
    asMsg("查询中…");
    try{ const r=await fetch("/api/lookup?code="+code); const j=await r.json(); if(!r.ok) return asMsg(j.error||"查询失败",1);
      if(j.exists) return asMsg(`「${j.name}」已经在股票池里了`,1);
      found=j; $("#as-name").value=j.name; $("#as-info").textContent=`${j.code}${j.market==="hk"?" · 港股":j.market==="b"?" · B 股":""}`;
      const guess=/^(5[0-9]|15|16)\d{4}$/.test(code)?"ETF":null; if(guess) $("#as-ind").value=guess;
      $("#as-res").hidden=false; asMsg("") }catch(e){ asMsg(e instanceof TypeError?"连不上收息佬本机服务，请确认程序还开着，刷新页面后再试":"查询失败："+e.message,1) } };
  $("#as-look").onclick=look; $("#as-code").onkeydown=e=>{if(e.key==="Enter") look()};
  $("#as-add").onclick=async()=>{ if(!found) return; if(!$("#as-ind").value) return asMsg("请先选择行业（决定买入价里的风险溢价）",1); if(state.refreshing) return asMsg("正在刷新数据，等刷新完再添加",1);
    try{ const r=await fetch("/api/stocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:found.code,name:$("#as-name").value.trim(),industry:$("#as-ind").value})}); const j=await r.json();
      if(!r.ok) return asMsg(j.error||"添加失败",1);
      $("#as-res").hidden=true; $("#as-code").value=""; asMsg(`已添加「${j.name}」，正在下载数据…`); found=null; poll() }catch(e){ asMsg("添加失败，请稍后再试",1) } };
  api("/api/missing").then(m=>{const el=$("#as-miss"); if(!el||!m.length) return;
    el.innerHTML=`<p class="note">这些股票已加入但还没有数据：${m.map(x=>`${x.name}（${x.code}）<button class="btn sm" data-retry="${x.code}" data-n="${x.name}" data-i="${x.industry}">重试下载</button>`).join(" ")}</p>`;
    el.querySelectorAll("[data-retry]").forEach(b=>b.onclick=async()=>{try{const r=await fetch("/api/stocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:b.dataset.retry,name:b.dataset.n,industry:b.dataset.i})}); const j=await r.json(); if(!r.ok) return notice(j.error||"重试失败"); b.textContent="下载中…"; b.disabled=true; poll()}catch(e){notice("重试失败，请稍后再试")}})}).catch(()=>{});
  $("#bk-out").onclick=()=>{const fn=`收息佬持仓备份-${today()}.json`; if(window.ShouxiAndroid){let ok=false; try{ok=ShouxiAndroid.saveFile(fn,JSON.stringify(state.holdings,null,1))}catch(e){} $("#bk-msg").textContent=ok?"已保存到手机「下载」文件夹":"保存失败，请稍后再试"; return} const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(state.holdings,null,1)],{type:"application/json"})); a.download=`收息佬持仓备份-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); $("#bk-msg").textContent="已导出"};
  $("#bk-in").onclick=()=>$("#bk-file").click();
  $("#bk-file").onchange=async e=>{const f=e.target.files[0]; if(!f) return; let j;
    try{ j=JSON.parse(await f.text()); if(!j||!Array.isArray(j.lots)) throw 0 }catch(x){ return notice("这不是有效的收息佬持仓备份文件") }
    if(!(await askConfirm(`用备份覆盖当前数据？备份里有 ${j.lots.length} 笔买入、${(j.sells||[]).length} 笔卖出。`,"覆盖"))) return;
    try{ const r=await fetch("/api/holdings",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(j)}); if(!r.ok) throw 0; await load(); renderSettings(); notice("已恢复") }catch(x){ notice("恢复失败，请稍后再试") }};
  // 管理股票池:移出 / 恢复
  const heldCodes=()=>new Set([...(state.holdings.lots||[]).map(l=>l.code),...(state.holdings.sells||[]).map(x=>x.code)]);
  const mgFill=()=>{const ql=$("#mq").value.trim().toLowerCase(), held=heldCodes(), fav=favSet();
    const list=P.stocks.filter(s=>!ql||s.name.toLowerCase().includes(ql)||s.code.includes(ql)||(s.py||"").includes(ql)||(s.pyfull||"").includes(ql));
    $("#mgb").innerHTML=list.map(s=>`<tr><td class="l"><b>${s.name}</b><div class="sub">${s.code}${s.market==="hk"?" · 港股":s.market==="b"?" · B 股":""}</div></td><td>${s.industry}</td><td>${fav.has(s.code)?'<span class="sub">已关注</span>':""}</td><td>${held.has(s.code)?'<span class="sub">持仓中</span>':`<button class="btn sm" data-rm="${s.code}">移出</button>`}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">没有匹配的股票</td></tr>';
    $("#mgb").querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const st=P.stocks.find(x=>x.code===b.dataset.rm); if(!st) return;
      if(!(await askConfirm(`把「${st.name}」移出股票池？${fav.has(st.code)||(S.overrides||{})[st.code]!=null?"它的关注和单独设定也会一起清除。":""}以后可以在这里恢复。`,"移出"))) return;
      if(await removeStock(st)) renderSettings()})};
  const rmFill=()=>{const rm=S.removed||[]; const el=$("#mgrm"); if(!rm.length){el.innerHTML="";return}
    el.innerHTML=`<h3 class="sectitle" style="margin-top:16px">已移出（${rm.length}）</h3><p class="note" style="margin:0 0 8px">点「恢复」会重新加入股票池，并自动下载数据，约半分钟。</p>`+rm.map(x=>`<div class="prow"><span class="pn">${x.name}<em>${x.code} · ${x.industry}</em></span><button class="btn sm" data-back="${x.code}">恢复</button></div>`).join("");
    el.querySelectorAll("[data-back]").forEach(b=>b.onclick=async()=>{const x=(S.removed||[]).find(y=>y.code===b.dataset.back); if(!x) return;
      if(state.refreshing) return notice("正在刷新数据，等刷新完再恢复");
      try{ const r=await fetch("/api/stocks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)}); const j=await r.json(); if(!r.ok) return notice(j.error||"恢复失败");
        S.removed=(S.removed||[]).filter(y=>y.code!==x.code); await saveHoldings(); b.textContent="下载中…"; b.disabled=true; poll() }catch(e){ notice("恢复失败，请稍后再试") }})};
  $("#mq").oninput=mgFill; mgFill(); rmFill();
  // 买入要求
  const keep=async()=>{const y=scrollY; await saveAndApply(); renderSettings(); scrollTo(0,y)};
  $("#rf").onchange=e=>{const v=+e.target.value; if(e.target.value===""||!(v>=0&&v<=8))return; S.rf=v; keep()};
  document.querySelectorAll("[data-prem]").forEach(i=>i.onchange=e=>{const v=+e.target.value; if(!(v>=0&&v<=12))return; S.premiums={...(S.premiums||{}),[i.dataset.prem]:v}; keep()});
  $("#resetcfg").onclick=()=>{delete S.rf; delete S.premiums; keep()};
  // 个股单独设定
  const tb=$("#ovb"), fmtB=s=>s.zones?num(s.zones.buy):"–";
  const rowHtml=s=>{const ov=(S.overrides||{})[s.code], def=c.rf+premOf(s.industry,c);
    return `<tr data-code="${s.code}"><td class="l"><b>${s.name}</b><div class="sub">${s.code}</div></td><td>${s.industry}</td><td>${def.toFixed(2)}%</td>
    <td><input type="number" step="0.1" min="0.5" max="15" class="ovin" data-code="${s.code}" value="${ov??""}" placeholder="默认"></td>
    <td class="eff"><b>${((s.floor||0)*100).toFixed(2)}%</b></td><td class="eb">${fmtB(s)}</td><td>${ov!=null?`<button class="btn sm ovclr" data-code="${s.code}">清除</button>`:""}</td></tr>`};
  const fill=()=>{const ql=$("#sq").value.trim().toLowerCase();
    const list=P.stocks.filter(s=>!ql||s.name.includes(ql)||s.code.includes(ql)||(s.py||"").includes(ql)||(s.pyfull||"").includes(ql));
    tb.innerHTML=list.map(rowHtml).join("")||'<tr><td colspan="7" class="empty">没有匹配的股票</td></tr>'};
  $("#sq").oninput=fill; fill();
  tb.addEventListener("change",async e=>{const i=e.target.closest(".ovin"); if(!i)return;
    const code=i.dataset.code, v=i.value===""?null:+i.value;
    if(v!==null&&!(v>0&&v<=15)){i.value=(S.overrides||{})[code]??"";return}
    S.overrides={...(S.overrides||{})}; v===null?delete S.overrides[code]:S.overrides[code]=v;
    await saveAndApply(); const s=P.stocks.find(x=>x.code===code), tr=i.closest("tr");
    tr.querySelector(".eff").innerHTML=`<b>${((s.floor||0)*100).toFixed(2)}%</b>`; tr.querySelector(".eb").textContent=fmtB(s);
    $("#ovcnt").textContent=ovn(); const last=tr.lastElementChild; last.innerHTML=v!==null?`<button class="btn sm ovclr" data-code="${code}">清除</button>`:""});
  tb.addEventListener("click",async e=>{const b=e.target.closest(".ovclr"); if(!b)return;
    S.overrides={...(S.overrides||{})}; delete S.overrides[b.dataset.code]; await saveAndApply(); fill(); $("#ovcnt").textContent=ovn()});
  $("#ovall").onclick=async()=>{if(!ovn()||!(await askConfirm("清除全部 "+ovn()+" 只股票的单独设定？","清除")))return; S.overrides={}; await saveAndApply(); fill(); $("#ovcnt").textContent=0};
}

/* ---------- 框架 ---------- */
function syncNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===state.tab))}
function render(){
  syncNav();
  if(state.tab==="hold") return renderHold();
  if(state.tab==="settings") return renderSettings();
  if(state.tab==="learn") return renderLearn();
  if(state.detail) return getStock(state.detail).then(renderDetail);
  renderPool();
}
window.addEventListener("scroll",()=>{const b=document.querySelector("#totop"); if(b) b.classList.toggle("show",scrollY>520)},{passive:true});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>goto({hold:"#/hold",settings:"#/settings",learn:"#/learn"}[b.dataset.tab]||"#/"));
$("#home").onclick=e=>{e.preventDefault(); state.f={q:"",ind:"",st:defaultView(),minY:0}; goto("#/")};
async function load(){
  state.cache={};
  api("/api/version").then(v=>{const e=document.getElementById("ver"); if(e) e.textContent="v"+v.version}).catch(()=>{}); try{state.privacy=localStorage.getItem("privacy")==="1"}catch(e){} try{const last=+localStorage.getItem("updLast")||0; if(Date.now()-last>20*3600e3){localStorage.setItem("updLast",String(Date.now())); checkUpdate(false).then(i=>showUpd(i,false))}}catch(e){} state.pool=await api("/api/pool"); state.holdings=await api("/api/holdings"); state.pool.stocks.forEach(applyZones);
  if(!state.viewInit){state.f.st=defaultView(); state.viewInit=true}
  $("#updated").textContent=state.pool.updated?"数据更新于 "+state.pool.updated:"尚无数据，请到「设置」刷新";
}
load().then(async()=>{route(); const s=await api("/api/status"); if(s.running)poll()});
</script>
